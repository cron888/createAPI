# ========================
# Primary DataSource (H2 in-memory)
# ========================
spring.datasource.url=jdbc:h2:mem:maindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ========================
# Secondary DataSource - Rules DB (PostgreSQL)
# ========================
spring.rule.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.rule.datasource.username=postgres
spring.rule.datasource.password=
spring.rule.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate - Primary
# ========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
